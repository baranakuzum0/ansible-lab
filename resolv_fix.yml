- name: /etc/resolv.conf içindeki nameserver'ları listele
  hosts: all
  gather_facts: no
  become: yes

  tasks:
    - name: resolv.conf dosyasını oku
      ansible.builtin.command: cat /etc/resolv.conf
      register: resolv_out

    - name: nameserver satırlarını ayıkla
      set_fact:
        dns_servers: "{{ resolv_out.stdout_lines | select('search', '^nameserver') | list }}"

    - name: Bulunan nameserver'ları göster
      ansible.builtin.debug:
        msg:
          - "Sunucuda tanımlı DNS sunucuları:"
          - "{{ dns_servers }}"
