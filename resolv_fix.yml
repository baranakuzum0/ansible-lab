---
- name: /etc/resolv.conf içindeki nameserver'ları listele
  hosts: all
  become: yes
  gather_facts: no

  tasks:
    - name: resolv.conf dosyasını oku
      ansible.builtin.command: cat /etc/resolv.conf
      register: resolv_out

    - name: nameserver IP'lerini ayıkla
      set_fact:
        nameservers: >-
          {{
            resolv_out.stdout_lines
            | select('match', '^nameserver')
            | map('split', ' ')
            | map('last')
            | list
          }}

    - name: Bulunan nameserver IP'lerini göster
      ansible.builtin.debug:
        msg:
          - "Sunucuda tanımlı DNS sunucuları:"
          - "{{ nameservers }}"
